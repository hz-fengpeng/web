[project]
name = "macro-fetcher"
version = "0.1.0"
description = "抓取真实宏观数据写入 resources/macro.db"
# 3.10 起 `X | Y` 才能在运行期直接用于 isinstance 之外的场合，
# 而本包在 dataclass 注解里大量使用；3.9 会在这里踩坑。
requires-python = ">=3.10"
dependencies = [
    # ★ 唯一的第三方依赖，且是**刻意的**：
    # 上游接口（东方财富 / 国家统计局 / 外汇局）的字段名与参数随时会变，
    # 自己维护一套解析器意味着每次变动都要有人跟进，而漏跟的后果是
    # **静默写错值**（列错位、口径变），不是报错。
    # akshare 有社区在跟这些变动，并且把结果整理成了中文列名的 DataFrame。
    #
    # 代价是 16 个传递依赖（pandas、requests、curl_cffi、lxml…），
    # 所以抓取器只跑在开发机上、跑完把 macro.db 提交进仓库，
    # **不进安装包、不进运行时**（应用本身仍然 `connect-src 'none'`，不联网）。
    #
    # ★ 下限分两档是**环境事实**，不是随手写的：akshare 1.18.90 起要求
    # Python >= 3.11，而本包允许 3.10（本机就是 3.10）。一条 `>=1.19`
    # 会让 `pip install -e .` 在 3.10 上直接报「找不到满足要求的版本」——
    # README 里那条安装命令因此跑不通。3.10 上装 1.18.x 实测可用
    # （本库现有的全部规则都是在 1.18.64 上验过的）。
    "akshare>=1.18; python_version < '3.11'",
    "akshare>=1.19; python_version >= '3.11'",
]

[project.optional-dependencies]
dev = ["pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["macro_fetcher", "macro_fetcher.sources"]
